version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mailpulse-db
    environment:
      POSTGRES_USER: mailpulse
      POSTGRES_PASSWORD: mailpulse_password
      POSTGRES_DB: mailpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: mailpulse-adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data:
