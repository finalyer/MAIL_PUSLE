version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mailpulse-db
    environment:
      POSTGRES_USER: mailpulse
      POSTGRES_PASSWORD: mailpulse_password
      POSTGRES_DB: mailpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
